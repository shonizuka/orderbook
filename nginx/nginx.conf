worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Disable access log buffering for SSE
    access_log /var/log/nginx/access.log combined buffer=0;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # Do NOT buffer SSE — essential for real-time streaming
    proxy_buffering off;

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ----------------------------------------------------------------
        # API — proxy to FastAPI backend
        # ----------------------------------------------------------------
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";

            # SSE-specific: disable buffering, set long read timeout
            proxy_buffering         off;
            proxy_cache             off;
            proxy_read_timeout      3600s;
            proxy_connect_timeout   10s;

            # Allow SSE content-type through
            add_header  Cache-Control  "no-cache";
            add_header  X-Accel-Buffering "no";
        }

        # ----------------------------------------------------------------
        # Health endpoint — direct to backend
        # ----------------------------------------------------------------
        location /health {
            proxy_pass         http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ----------------------------------------------------------------
        # Everything else — Next.js frontend
        # ----------------------------------------------------------------
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }
}
